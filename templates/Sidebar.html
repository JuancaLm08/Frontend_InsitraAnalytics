<!-- Elementos css de Sidebar -->
<link rel="stylesheet" href="../static/css/estilo_SideBar.css">

<aside class="sidebar" id="sidebar">

    <!-- CABECERA "MÓDULOS" (el chevron es decorativo) -->
    <div class="sidebar-modulos-header">
        <span class="mh-left">
            <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>
            <span>Módulos</span>
        </span>
        <span class="mh-chevron" aria-hidden="true">
            <svg viewBox="0 0 24 24"><polyline points="6 9 12 15 18 9"/></svg>
        </span>
    </div>

    <!-- MENÚ -->
    <nav class="menu">
        <p class="menu-title">Paneles</p>

        <a id="default-view" onclick="changeView('Inicio', this)">
            <span class="icon">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
            </span>
            <span class="text">Inicio</span>
        </a>

        {% if 2 in permisos %}
        <a onclick="changeView('Totales', this)">
            <span class="icon">
                <svg viewBox="0 0 24 24" aria-hidden="true"><line x1="6" y1="20" x2="6" y2="15"/><line x1="12" y1="20" x2="12" y2="9"/><line x1="18" y1="20" x2="18" y2="4"/></svg>
            </span>
            <span class="text">Totales</span>
        </a>
        {% endif %}

        {% if 3 in permisos %}
        <a onclick="changeView('Unidades', this)">
            <span class="icon">
                <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="12" rx="2"/><line x1="3" y1="11" x2="21" y2="11"/><circle cx="7.5" cy="19" r="1.6"/><circle cx="16.5" cy="19" r="1.6"/></svg>
            </span>
            <span class="text">Unidades</span>
        </a>
        {% endif %}

        {% if 4 in permisos %}
        <a onclick="changeView('Ruta', this)">
            <span class="icon">
                <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="6" cy="19" r="2.6"/><circle cx="18" cy="5" r="2.6"/><path d="M9 19h7a3.5 3.5 0 0 0 0-7H8a3.5 3.5 0 0 1 0-7h7"/></svg>
            </span>
            <span class="text">Ruta</span>
        </a>
        {% endif %}

        {% if 5 in permisos %}
        <a onclick="changeView('Horaria', this)">
            <span class="icon">
                <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><polyline points="12 7 12 12 15.5 14"/></svg>
            </span>
            <span class="text">Horaria</span>
        </a>
        {% endif %}

        {% if 6 in permisos %}
        <a onclick="changeView('PoligonoCarga', this)">
            <span class="icon">
                <svg viewBox="0 0 24 24" aria-hidden="true"><polyline points="3 17 9 11 13 15 21 7"/><polyline points="15 7 21 7 21 13"/></svg>
            </span>
            <span class="text">Polígono de Carga</span>
        </a>
        {% endif %}
    </nav>

    <!-- FILTROS -->
    <div class="filters">
        <p class="menu-title">Filtros</p>
        <label for="select-corredor">Corredor</label>
        <select id="select-corredor">
        </select>
    </div>

    <!-- FOOTER -->
    <div class="sidebar-footer">
        <p class="sidebar-footer-eyebrow">Desarrollado por</p>
        <div class="sidebar-footer-brand">
            <img src="../static/images/insitra_logo.png" alt="">
            <span>INSITRA</span>
        </div>
    </div>

</aside>

<!-- JavaScript de la Sidebar -->
<script src="../static/js/js_Sidebar.js"></script>
